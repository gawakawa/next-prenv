services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: app
    ports:
      - '3306:3306'
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-uroot', '-ppassword']
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      target: builder
    # `db`'s healthcheck can report healthy a moment before it accepts new
    # connections, so retry migrate:deploy a few times before giving up.
    command: sh -c "for i in 1 2 3 4 5; do pnpm migrate:deploy && break || sleep 3; done && pnpm seed"
    environment:
      DATABASE_URL: mysql://root:password@db:3306/app
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    environment:
      DATABASE_URL: mysql://root:password@db:3306/app
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  db-data:
